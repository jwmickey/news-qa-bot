<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}News QA{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' x='4' font-size='26' fill='%23C31237'>&#182;</text></svg>">
</head>
<body>
  <header class="rail">
    <a class="rail-mark" href="/">News&nbsp;QA</a>
    <nav>
      <a href="/" {% if nav == 'dashboard' %}aria-current="page"{% endif %}>Desk</a>
      <a href="/issues" {% if nav == 'issues' %}aria-current="page"{% endif %}>Marks</a>
      <a href="/scans" {% if nav == 'scans' %}aria-current="page"{% endif %}>Scans</a>
      <a href="/sources" {% if nav == 'sources' %}aria-current="page"{% endif %}>Sources</a>
      <a href="/dictionary" {% if nav == 'dictionary' %}aria-current="page"{% endif %}>Dictionary</a>
      <a href="/rules" {% if nav == 'rules' %}aria-current="page"{% endif %}>Rules</a>
    </nav>
  </header>

  <main>{% block main %}{% endblock %}</main>
</body>
</html>

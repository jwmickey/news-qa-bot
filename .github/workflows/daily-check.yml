# Manual smoke test only.
#
# The scheduled run moved to the local machine when this project gained a
# SQLite database: scan state now lives in data/news_qa.db, which cannot
# survive between Actions runs. (The previous actions/cache step could not
# either -- its key never rotated, so seen_articles.json froze after the first
# successful run and every article was re-checked forever.)
#
# For the daily run see scripts/com.jody.newsqa.plist and the README.
name: WRAL check (manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles to check"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run a scan
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -m news_qa scan --limit "${{ inputs.limit }}"
          python -m news_qa report
